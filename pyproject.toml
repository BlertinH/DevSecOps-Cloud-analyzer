[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iacgraph"
version = "0.1.0"
description = "Find insecure configurations and attack paths in Terraform plans for AWS, using graph algorithms"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["networkx>=3.3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
