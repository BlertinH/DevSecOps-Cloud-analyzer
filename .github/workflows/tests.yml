name : tests

on:
  pull_request:
    push:
    branches: [main]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name : Get the code
        uses : actions/checkout@v6

      - name : Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      
      - name: Install iacgraph and pytest
        run : pip install -e ".[dev]"

      - name: Run the tests
        run: python -m pytest
