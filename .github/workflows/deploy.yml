name: deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: demo-secure

jobs:
  apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      TF_VAR_bucket_suffix: ${{ vars.DEMO_BUCKET_SUFFIX }}
    steps:
      - name: Get the code
        uses: actions/checkout@v6

      - name: Sign in to AWS (deploy role)
        usese: aws-actions/configure-aws-credentials@v6
        with:
         role-to-assume: ${{vars.AWS_DEPLOY_ROLE_ARN}}
         aws-region: ${{vars.AWS_REGION}}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_wrapper: false

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install iacgraph
        run: pip install .
      
      - name: Terraform plan
        working-directory: terraform/demo-secure
        run: |
          terraform init -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}"
          terraform plan -out=tfplan
          terraform show -json tfplan > plan.json

      - name: Security gate (PASS or BLOCK)
        working-directory: terraform/demo-secure
        run: iacgraph plan.json --policy policy.json

      - name: Terraform apply
        working-directory: terraform/demo-secure
        run: terraform apply tfplan